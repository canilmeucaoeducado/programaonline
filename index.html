<style>
  :root {
    --orange: #5A6B2D;
    --orange-light: #78874B;
    --orange-glow: rgba(90,107,45,0.15);
    --dark: #FFFFFF;
    --dark2: #E1E1D2;
    --dark3: #d0d0bc;
    --dark4: #c2c2aa;
    --white: #3B4D1E;
    --white80: rgba(59,77,30,0.85);
    --white40: rgba(59,77,30,0.55);
    --white10: rgba(59,77,30,0.10);
    /* Extra tokens */
    --navy: #3B4D1E;
    --royal: #2d3d15;
    --cta: #7A9440;
    --cta-dark: #5A6B2D;
    --link: #5A6B2D;
    --check-green: #5A6B2D;
    --star: #78874B;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Outfit', Arial, sans-serif;
    background: var(--dark);
    color: var(--white);
    overflow-x: hidden;
    line-height: 1.6;
  }

  /* Ensure all section text defaults to dark readable color on light backgrounds */
  section { color: var(--white); }

  /* noise texture removida para melhorar INP e performance */

  /* ========== HERO ========== */
  .hero {
    background: var(--dark2) url('https://canilmeucaoeducado.github.io/meucaoeducado/preview.webp') center center / cover no-repeat;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 80px 20px 80px;
  }

  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.40);
    pointer-events: none;
    z-index: 0;
  }

  .hero::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center top, rgba(90,107,45,0.12) 0%, transparent 65%);
    pointer-events: none;
    z-index: 0;
  }
  
  .hero > * {
    position: relative;
    z-index: 1;
  }

  .hero-bg-circle {
    position: absolute;
    width: 900px;
    height: 900px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(90,107,45,0.10) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    /* CLS FIX: elemento puramente decorativo, fora do fluxo, sem influência no layout */
    contain: strict;
    will-change: auto;
    z-index: 0;
    inset: auto;
  }


  .hero-lines {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(59,77,30,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,77,30,0.06) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 100px;
    padding: 6px 16px;
    font-size: 16px;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 28px;
    animation: fade-up 0.6s ease both;
  }

  .hero-title {
    font-family: 'Outfit', Arial, sans-serif;
    font-size: clamp(40px, 7vw, 80px);
    font-weight: 800;
    -webkit-text-stroke: 0px transparent;
    line-height: 1.05;
    text-align: center;
    max-width: 860px;
    letter-spacing: 0.02em;
    animation: fade-up 0.7s 0.1s ease both;
    color: #ffffff;
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
    text-wrap: balance;
  }

  .hero-title span {
    color: #ffffff;
    display: block;
  }

  .hero-sub {
    font-size: clamp(16px, 2vw, 20px);
    color: #f2f2f2;
    text-shadow: 0 1px 8px rgba(0,0,0,0.5);
    text-align: center;
    max-width: 580px;
    margin: 24px auto 0;
    font-weight: 400;
    animation: fade-up 0.7s 0.2s ease both;
  }

  .hero-cta {
    animation: fade-up 0.7s 0.3s ease both;
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .btn-primary {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: var(--cta);
    color: white;
    font-family: 'Outfit', Arial, sans-serif;
    font-weight: 800;
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 18px 44px;
    border-radius: 6px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
    box-shadow: 0 4px 20px rgba(90,107,45,0.40);
  }

  /* Neon glow via pseudo-element — animates opacity (GPU, sem layout) */
  .btn-primary::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 6px;
    box-shadow: 0 0 24px rgba(122,148,64,0.9), 0 0 60px rgba(122,148,64,0.5);
    opacity: 0.5;
    animation: neon-pulse 1.6s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes neon-pulse {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 1; }
  }

  .btn-primary::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(90,107,45,0.45);
    background: var(--cta-dark);
    animation: none;
  }

  .btn-primary:hover::after {
    opacity: 1;
    animation: none;
  }

  .btn-primary:hover::before { opacity: 1; }

  .btn-arrow { font-size: 20px; transition: transform 0.2s; }
  .btn-primary:hover .btn-arrow { transform: translateX(4px); }

  .hero-trust {
    margin-top: 32px;
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 16px;
    font-weight: 700;
    color: #3B4D1E;
    animation: fade-up 0.7s 0.4s ease both;
  }

  .trust-divider { width: 1px; height: 20px; background: var(--white10); }

  /* ========== VIDEO SECTION ========== */
  .video-section {
    background: var(--dark2);
    padding: 80px 20px;
    text-align: center;
  }

  .section-label {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #5A6B2D;
    margin-bottom: 14px;

  .section-title {
    font-family: 'Outfit', Arial, sans-serif;

    position: relative;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    border: 1px solid rgba(90,107,45,0.20);
  }

  .video-wrapper::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 13px;
    background: linear-gradient(135deg, rgba(90,107,45,0.30), transparent 50%, rgba(90,107,45,0.10));
    pointer-events: none;
    z-index: 1;
  }

  .video-wrapper iframe {
    width: 100%;
    aspect-ratio: 16/9;
    display: block;
    border: none;
  }

  /* ========== WHAT YOU GET ========== */
  .benefits-section {
    padding: 100px 20px;
    background: var(--dark);
    position: relative;
  }

  .benefits-section::before {
    content: '';
    position: absolute;
    top: 0; left: 50%; transform: translateX(-50%);
    width: 600px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(90,107,45,0.40), transparent);
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
  }

  .text-center { text-align: center; }

  .benefits-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 2px;
    margin-top: 60px;
    border: 1px solid var(--white10);
    border-radius: 12px;
    overflow: hidden;
  }

  .benefit-item {
    background: var(--dark2);
    padding: 36px 32px;
    display: flex;
    align-items: flex-start;
    gap: 18px;
    transition: background 0.3s;
    position: relative;
  }

  .benefit-item:hover {
    background: var(--dark3);
  }

  .benefit-icon {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: var(--orange-glow);
    border: 1px solid rgba(90,107,45,0.20);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .benefit-text h3 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 6px;
    color: #3B4D1E;
  }

  .benefit-text p {
    font-size: 16px;
    color: #4B3C1E;
    line-height: 1.5;
  }

  /* ========== MODULES ========== */
  .modules-section {
    padding: 52px 20px 100px;
    background: var(--dark);
  }

  .modules-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
    margin-top: 60px;
  }

  .module-card {
    background: #E1E1D2;
    border: 1px solid rgba(59,77,30,0.10);
    border-radius: 12px;
    padding: 32px 28px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s, transform 0.3s;
    cursor: default;
  }

  .module-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
background: linear-gradient(90deg, var(--orange), var(--orange-light));
    opacity: 0;
    transition: opacity 0.3s;
  }

  .module-card:hover {
    border-color: rgba(90,107,45,0.40);
  }

  .module-card:hover::before { opacity: 1; }

  .module-num {
    font-family: 'Outfit', Arial, sans-serif;
    font-size: 60px;
    line-height: 1;
    color: rgba(59,77,30,0.06);
    position: absolute;
    top: 20px;
    right: 20px;
    transition: color 0.3s;
  }

  .module-card:hover .module-num { color: rgba(90,107,45,0.25); }

  .module-emoji { font-size: 32px; margin-bottom: 14px; display: block; }

  .module-card h3 {
    font-family: 'Outfit', Arial, sans-serif;
    font-size: 26px;
    letter-spacing: 0.02em;
    margin-bottom: 10px;
    color: #3B4D1E;
  }

  .module-card p {
    font-size: 16px;
    color: #4B3C1E;
    line-height: 1.6;
  }

  .module-subtitle {
    font-size: 16px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #5A6B2D;
    margin-bottom: 6px !important;
  }

  .module-lessons {
    margin-top: 16px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: #5A6B2D;
    text-transform: uppercase;
  }

  /* ========== FOR WHO ========== */
  .forwhom-section {
    padding: 100px 20px;
    background: var(--dark);
  }

  .forwhom-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: center;
    margin-top: 60px;
  }

  @media (max-width: 768px) {
    .forwhom-grid { grid-template-columns: 1fr; gap: 40px; }
  }

  .check-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .check-item {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 18px 20px;
    background: var(--dark2);
    border-radius: 10px;
    border: 1px solid var(--white10);
    font-size: 16px;
    color: #4B3C1E;
    transition: border-color 0.3s;
  }

  .check-item:hover { border-color: rgba(90,107,45,0.40); }

  .check-icon {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--check-green);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
    font-size: 11px;
  }

  .trainer-card {
    background: var(--dark3);
    border: 1px solid var(--white10);
    border-radius: 16px;
    padding: 40px;
    text-align: center;
  }

  .trainer-img-wrap {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    margin: 0 auto 24px;
    padding: 3px;
    background: linear-gradient(135deg, #5A6B2D, #78874B);

  }

  .trainer-img-wrap img {
    width: 100%;

  .trainer-card h3 {
    font-family: 'Outfit', Arial, sans-serif;
    font-size: 32px;

    margin-bottom: 6px;
    color: #3B4D1E;
  }

  .trainer-card .role {
    color: var(--link);
    font-size: 16px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 16px;
  }

  .trainer-card p {
    font-size: 16px;
    color: #4B3C1E;
    line-height: 1.7;
  }

  /* ========== PRICING ========== */
  .pricing-section {
    padding: 100px 20px;
    background: var(--dark);
    text-align: center;
    position: relative;
  }

  .price-card {
    max-width: 520px;
    margin: 60px auto 0;
    background: var(--dark3);
    border: 1px solid rgba(90,107,45,0.35);
    border-radius: 20px;
    padding: 52px 48px;
    position: relative;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  }

  .price-card::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 21px;
    background: linear-gradient(135deg, rgba(90,107,45,0.20), transparent, rgba(90,107,45,0.08));
    pointer-events: none;
    z-index: -1;
  }

  .price-badge {
    display: inline-block;
    background: var(--cta);
    color: white;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 4px;
    margin-bottom: 24px;
  }

  .price-original {
    font-size: 16px;
    color: #4B3C1E;
    text-decoration: line-through;
    margin-bottom: 8px;
  }

  .price-main {
    font-family: 'Outfit', Arial, sans-serif;
    font-size: 28px;
    color: #3B4D1E;
    margin-bottom: 4px;
  }

  .price-value {
    font-family: 'Outfit', Arial, sans-serif;
    font-size: clamp(38px, 8vw, 68px);
    line-height: 1.1;
    color: var(--orange);
    margin-bottom: 24px;
  }

  .price-includes {
    list-style: none;
    margin-bottom: 36px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .price-includes li {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    color: #4B3C1E;
    text-align: left;
  }

  .price-includes li::before {
    content: '✓';
    width: 20px; height: 20px;
    border-radius: 50%;
    background: rgba(90,107,45,0.10);
    border: 1px solid rgba(90,107,45,0.30);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--check-green);
    flex-shrink: 0;
  }

  .guarantee {
    margin-top: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--white10);
    border-radius: 10px;
    padding: 16px 20px;
    font-size: 16px;
    color: #4B3C1E;
  }

  .guarantee-icon { font-size: 28px; flex-shrink: 0; }

  /* ========== FAQ ========== */
  .faq-section {
    padding: 100px 20px;
    background: var(--dark);
  }

  .faq-list {
    max-width: 720px;
    margin: 60px auto 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--white10);
  }

  .faq-item {
    background: #FFFFFF;
  }

  .faq-q {
    width: 100%;
    background: none;
    border: none;
    color: #4B3C1E;
    font-family: 'Outfit', Arial, sans-serif;
    font-size: 16px;
    font-weight: 600;
    text-align: left;
    padding: 22px 28px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    transition: background 0.2s;

  .faq-q:hover { background: #E1E1D2; }

  .faq-arrow {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: rgba(90,107,45,0.12);
    border: 1px solid rgba(90,107,45,0.25);

    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 12px;
    color: #5A6B2D;

  .faq-item.open .faq-arrow {
    transform: rotate(180deg);
    background: rgba(90,107,45,0.25);
  }

  .faq-a {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease, padding 0.3s;

  .faq-item.open .faq-a { max-height: 300px; }

  .faq-a-inner {

    font-size: 16px;
    color: #4B3C1E;
    line-height: 1.7;
  }

  /* ========== FINAL CTA ========== */
  .final-cta {
    padding: 120px 20px;
    background: var(--dark);
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .final-cta::before {
    content: '';
    position: absolute;
    width: 1000px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(90,107,45,0.08) 0%, transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);

  .final-cta .section-title {

    margin: 0 auto 20px;
  }

  .final-cta .section-subtitle {
    margin-bottom: 44px;
  }

  /* ========== FOOTER ========== */
  footer {
    background: #3B4D1E;
    padding: 28px 20px;
    text-align: center;
    font-size: 16px;
    /* OTIMIZAÇÃO 5: cor aumentada de rgba(209,220,237,0.55) para #a8c4d4 — contraste ≥ 4.5:1 sobre #3B4D1E */
    color: #E1E1D2;
    border-top: 1px solid rgba(255,255,255,0.15);
  }

  /* ========== SCROLL ANIMATIONS ========== */
  .reveal {
    opacity: 0;
    transform: translate3d(0,40px,0);
    transition: opacity 0.7s ease, transform 0.7s ease;
    will-change: opacity, transform;
  }

  .reveal.visible {
    opacity: 1;
    transform: translate3d(0,0,0);
    will-change: auto;
  }

  /* ========== STICKY CTA ========== */
  .sticky-bar {
    position: fixed;
